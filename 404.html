<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e3a5f">
<title>Página no encontrada · Al Dedillo</title>
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/entrada.css">
<style>
  .error {
    max-width: 620px;
    margin: clamp(3rem, 12vh, 7rem) auto;
    padding: 0 var(--espacio-3);
    text-align: center;
  }
  .error-codigo {
    margin: 0;
    color: var(--color-primary);
    font-family: var(--font-display);
    font-size: clamp(4rem, 18vw, 8rem);
    line-height: 1;
  }
  .error h1 {
    margin: var(--espacio-2) 0 var(--espacio-2);
    font-size: clamp(1.5rem, 4vw, 2rem);
  }
  .error p {
    margin: 0 auto;
    max-width: 46ch;
    color: var(--color-muted-text);
  }
  .error-acciones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--espacio-2);
    margin-top: var(--espacio-4);
  }
</style>
</head>
<body>
  <main id="contenido" class="error">
    <p class="error-codigo" aria-hidden="true">404</p>
    <h1>Esa página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio o abre directamente el manual.</p>
    <div class="error-acciones">
      <a class="boton-principal" href="/">Volver al inicio</a>
      <a class="boton-secundario" href="/app.html#manual">Abrir el manual</a>
    </div>
  </main>
</body>
</html>
