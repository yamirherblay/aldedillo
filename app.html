  <!-- ══ Lógica: un solo módulo arranca todo (router → core → ui) ══ -->
  <script type="module" src="ui/router.js"></script>
  <script>
    // Aviso si se abre con doble clic (file://): los módulos ES no cargan ahí.
    if (location.protocol === "file:") {
      document.getElementById("main").innerHTML =
        '<div class="vacia"><h2>Necesitas un servidor local</h2>' +
        "<p>La app usa módulos ES y el navegador los bloquea al abrir el archivo directo. " +
        "Desde la carpeta <code>al-dedillo/</code> ejecuta:</p>" +
        '<p><code>python3 -m http.server 8642</code></p>' +
        '<p>y abre <code>http://localhost:8642/app.html</code></p></div>';
    }
    // Service Worker: modo sin conexión (Fase 4). No bloquea el render.
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      // Si un SW nuevo toma el control, recargar una vez para usar el código
      // nuevo (recupera solo a los equipos con una versión anterior defectuosa).
      let teniaControl = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (teniaControl) location.reload();
        teniaControl = true;
      });
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
